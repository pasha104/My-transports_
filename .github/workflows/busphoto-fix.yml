name: BUSPHOTO surgical fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('interactive-routes.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="route-menu-grid">\n<div class="interactive-card">\n<h3>🚌 Распределение автобусов</h3>\n<div class="interactive-muted" style="margin-bottom:8px;">\n                            Маршруты создаются только на карте. Здесь можно назначать купленные ТС на готовую линию.\n                            Назначение не меняет деньги и ЗП.\n                        </div>\n<div id="routeAssignmentSummary"></div>\n</div>\n</div>\n<div class="interactive-card" style="margin-top:12px;">'''
          new='''<div class="route-menu-grid">\n<div class="interactive-card" style="display:none"><div id="routeAssignmentSummary"></div></div>\n</div>\n<div class="interactive-card" style="margin-top:12px;">'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('busphoto-interactive.js')
          s=p.read_text(encoding='utf-8')
          if '"БКМ-Е350"' not in s:
              needle='''"БКМ-Е433": { price: 90000, salary: [12000, 15000] }'''
              repl='''"БКМ-Е433": { price: 90000, salary: [12000, 15000] },\n                "БКМ-Е350": { price: 110000, salary: [10000, 14000], capacity: 53, seats: 42, rangeKm: 100, maxSpeedKmh: 90, motorKw: 220 }'''
              if needle not in s: raise SystemExit('E350 insertion point not found')
              s=s.replace(needle,repl,1)

          p2=Path('creating_card.html')
          c=p2.read_text(encoding='utf-8')
          oldc='function compatible(v,r){return !v||!r||v.category===r.routeType||(v.category===\'bus\'&&r.routeType===\'bus\')}'
          newc='''function compatible(v,r){\n if(!v||!r)return false;\n const sameCategory=v.category===r.routeType || (v.category==='bus'&&r.routeType==='bus');\n if(!sameCategory)return false;\n const service=String(r.routeServiceType||r.serviceType||'city');\n if(v.category==='bus'){\n   const classes={'МАЗ-101':['city'],'МАЗ-103':['city','suburban'],'МАЗ-104':['city','suburban'],'МАЗ-105':['city'],'МАЗ-107':['city','suburban'],'МАЗ-152':['suburban','intercity'],'МАЗ-203':['city','suburban'],'МАЗ-205':['city'],'МАЗ-206':['city','suburban'],'МАЗ-215':['city'],'МАЗ-216':['city'],'МАЗ-226':['city','suburban'],'МАЗ-231':['suburban'],'МАЗ-232':['suburban'],'МАЗ-241':['suburban'],'МАЗ-251':['suburban','intercity'],'МАЗ-256':['suburban'],'МАЗ-257':['suburban'],'МАЗ-303':['city','suburban']};\n   const allowed=classes[v.model] || [String(v.serviceType||'city')];\n   return allowed.includes(service) && (!v.serviceType || v.serviceType===service);\n }\n if(v.category==='electrobus') return service==='city'||service==='suburban';\n return service==='city';\n}'''
          if oldc in c: c=c.replace(oldc,newc,1)
          card_patch=r'''\n<script>\n(function(){\n  window.BUSPHOTO_CARD_ROUTE_FIX_V2=true;\n  function routeCompatible(v,r){\n    if(!v||!r)return false;\n    const same=v.category===r.routeType || (v.category==='bus'&&r.routeType==='bus');\n    if(!same)return false;\n    const service=String(r.routeServiceType||r.serviceType||'city');\n    if(v.category==='electrobus')return service==='city'||service==='suburban';\n    if(v.category==='trolleybus')return service==='city';\n    const classes={'МАЗ-101':['city'],'МАЗ-103':['city','suburban'],'МАЗ-104':['city','suburban'],'МАЗ-105':['city'],'МАЗ-107':['city','suburban'],'МАЗ-152':['suburban','intercity'],'МАЗ-203':['city','suburban'],'МАЗ-205':['city'],'МАЗ-206':['city','suburban'],'МАЗ-215':['city'],'МАЗ-216':['city'],'МАЗ-226':['city','suburban'],'МАЗ-231':['suburban'],'МАЗ-232':['suburban'],'МАЗ-241':['suburban'],'МАЗ-251':['suburban','intercity'],'МАЗ-256':['suburban'],'МАЗ-257':['suburban'],'МАЗ-303':['city','suburban']};\n    const allowed=classes[v.model]||[String(v.serviceType||'city')];\n    return allowed.includes(service)&&(!v.serviceType||v.serviceType===service);\n  }\n  function refreshStage(stage){\n    if(!stage)return;\n    const ve=document.getElementById('vehicle');\n    const vehicle=(Array.isArray(window.state?.owned)?state.owned:[]).find(v=>String(v.id)===String(ve?.value));\n    const routes=(Array.isArray(window.state?.routes)?state.routes:[]).filter(r=>routeCompatible(vehicle,r));\n    let select=stage.querySelector('select.route');\n    if(!select){\n      const label=document.createElement('label');label.className='field';label.textContent='Маршрут';\n      select=document.createElement('select');select.className='route';label.appendChild(select);\n      const grid=stage.querySelector('.grid3');if(grid)grid.insertBefore(label,grid.firstElementChild);else stage.appendChild(label);\n    }\n    let search=stage.querySelector('.routeSearch');\n    if(!search){\n      search=document.createElement('input');search.className='routeSearch';search.type='search';search.placeholder='Поиск маршрута…';search.style.cssText='width:100%;min-height:44px;padding:10px;border:1px solid #777;border-radius:8px;background:#fff;color:#000;font-size:16px;margin-top:5px;';\n      select.parentNode.insertBefore(search,select);\n    }\n    const current=select.value;const q=String(search.value||'').trim().toLowerCase();\n    const filtered=routes.filter(r=>!q||[r.number,r.name,r.start,r.end].filter(Boolean).join(' ').toLowerCase().includes(q));\n    select.innerHTML=filtered.length?filtered.map(r=>`<option value="${String(r.id).replaceAll('"','&quot;')}">№${String(r.number??'')} — ${String(r.start||'—')} → ${String(r.end||'—')}</option>`).join(''):'<option value="">Нет подходящих маршрутов</option>';\n    if(current&&filtered.some(r=>String(r.id)===String(current)))select.value=current;else if(filtered[0])select.value=filtered[0].id;\n    try{if(typeof fillStops==='function')fillStops(stage)}catch(e){}\n    try{if(typeof recalc==='function')recalc()}catch(e){}\n  }\n  function refreshAll(){document.querySelectorAll('#stages .stage').forEach(refreshStage)}\n  function install(){\n    refreshAll();document.getElementById('vehicle')?.addEventListener('change',refreshAll);\n    const stages=document.getElementById('stages');\n    if(stages){new MutationObserver(refreshAll).observe(stages,{childList:true,subtree:true});stages.addEventListener('input',e=>{if(e.target.classList.contains('routeSearch'))refreshAll()})}\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else setTimeout(install,0);\n})();\n</script>\n'''
          if 'BUSPHOTO_CARD_ROUTE_FIX_V2' not in c:
              c=c.replace('</body>',card_patch+'</body>') if '</body>' in c else c+card_patch
          p2.write_text(c,encoding='utf-8')

          runtime=r'''\n/* BUSPHOTO surgical route/model patch 20260902 */\n(function(){\n  if(window.__BUSPHOTO_ROUTE_MODEL_PATCH_20260902__)return;\n  window.__BUSPHOTO_ROUTE_MODEL_PATCH_20260902__=true;\n  if(typeof gameCatalog!=='undefined'&&gameCatalog.electrobus){gameCatalog.electrobus['БКМ-Е350']={price:110000,salary:[10000,14000],capacity:53,seats:42,rangeKm:100,maxSpeedKmh:90,motorKw:220};}\n  const oldSupports=window.gameModelSupportsType;\n  window.gameModelSupportsType=function(model,type){const cat=document.getElementById('gameCategory')?.value;if(cat==='electrobus')return type==='all'||type==='city'||type==='suburban';if(cat==='trolleybus')return type==='all'||type==='city';return oldSupports?oldSupports(model,type):true;};\n  const oldClass=window.updateBusRouteClassVisibility;\n  window.updateBusRouteClassVisibility=function(){const type=document.getElementById('mapRouteType')?.value||'bus';const el=document.getElementById('mapBusRouteClass');if(!el)return;[...el.options].forEach(o=>o.hidden=(type==='electrobus'&&o.value==='intercity')||(type==='trolleybus'&&o.value!=='city'));el.style.display='block';if(type==='electrobus'&&el.value==='intercity')el.value='city';if(type==='trolleybus')el.value='city';if(oldClass&&type==='bus')try{oldClass()}catch(e){}};\n  const oldLoad=window.loadGameState;if(oldLoad)window.loadGameState=function(){oldLoad();(gameState.routes||[]).forEach(r=>{if(r.routeType==='electrobus'&&r.routeServiceType==='intercity')r.routeServiceType='city';if(r.routeType==='trolleybus'&&r.routeServiceType!=='city')r.routeServiceType='city';});(gameState.owned||[]).forEach(v=>{if(v.category==='electrobus'&&v.model==='БКМ-Е350')v.passengerCapacity=53;});if(typeof saveGameState==='function')saveGameState();};\n  document.addEventListener('change',e=>{if(e.target?.id==='mapRouteType')window.updateBusRouteClassVisibility();},{passive:true});\n})();\n'''
          if 'BUSPHOTO surgical route/model patch 20260902' not in s:s+=runtime
          hook=r'''\n(function(){\n  const oldRenderRoutes=window.renderRoutes;if(typeof oldRenderRoutes!=='function')return;\n  window.renderRoutes=function(){oldRenderRoutes();const list=document.getElementById('routesList');if(!list)return;list.querySelectorAll('.route-badge').forEach(e=>e.remove());list.querySelectorAll('button').forEach(b=>{if((b.textContent||'').includes('ТС на маршруте'))b.remove()});list.querySelectorAll('.route-card').forEach(card=>{card.querySelectorAll('div').forEach(div=>{if((div.textContent||'').trim().startsWith('🚍 ТС на маршруте —'))div.remove()});card.querySelectorAll('.route-assignment').forEach(box=>{const del=[...box.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Удалить маршрут'));box.innerHTML='';if(del)box.appendChild(del);});});};\n})();\n'''
          if 'startsWith(\'🚍 ТС на маршруте —\')' not in s:s+=hook
          p.write_text(s,encoding='utf-8')

          p=Path('index.html');s=p.read_text(encoding='utf-8');s=s.replace('<option value="service">Служебный</option>\n<option value="—">—</option>','<option value="service">Служебный</option>\n<option value="museum">Музейный</option>\n<option value="—">—</option>');p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-routes.html busphoto-interactive.js creating_card.html index.html .github/workflows/busphoto-fix.yml
          git rm .github/workflows/busphoto-fix.yml
          git diff --cached --quiet || git commit -m "Fix card routes and transport route classes"
          git push
