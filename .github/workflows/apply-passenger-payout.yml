name: Apply passenger payout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payout and museum purpose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('busphoto-interactive.js')
          s=p.read_text(encoding='utf-8')
          if 'GAME_PASSENGER_CAPACITY' not in s:
              marker='        function processServiceCardPayouts(now = new Date()) {'
              insert='''        const GAME_PASSENGER_CAPACITY = {\n            "МАЗ-101":123,"МАЗ-103":103,"МАЗ-104":110,"МАЗ-105":190,"МАЗ-107":150,"МАЗ-152":145,"МАЗ-203":105,"МАЗ-205":185,"МАЗ-206":72,"МАЗ-215":183,"МАЗ-216":169,"МАЗ-226":72,"МАЗ-231":80,"МАЗ-232":45,"МАЗ-241":36,"МАЗ-251":44,"МАЗ-256":43,"МАЗ-257":48,"МАЗ-303":110,\n            "МАЗ-103Т":108,"МАЗ-203Т":103,"МАЗ-303Т":75,"АКСМ-101":114,"БКМ-201":109,"БКМ-213":168,"БКМ-321":115,"БКМ-333":170,"БКМ-420":115,"БКМ-433":153,\n            "МАЗ-303Е":72,"МАЗ-305Е":150,"БКМ-Е321":83,"БКМ-Е433":153\n        };\n        function getPassengerCapacity(vehicle){\n            const model=String(vehicle?.model||vehicle?.modelPrefix||'').trim();\n            if(GAME_PASSENGER_CAPACITY[model]) return GAME_PASSENGER_CAPACITY[model];\n            const key=Object.keys(GAME_PASSENGER_CAPACITY).find(k=>model===k || model.startsWith(k+' ') || model.startsWith(k+'.'));\n            return key ? GAME_PASSENGER_CAPACITY[key] : 0;\n        }\n        function getRandomPassengerLoad(capacity){\n            if(!capacity) return 0;\n            const ranges=[[0.15,0.40],[0.40,0.75],[0.70,0.95],[0.95,1.00]];\n            const [min,max]=ranges[Math.floor(Math.random()*ranges.length)];\n            return Math.min(capacity,Math.round(capacity*(min+Math.random()*(max-min))));\n        }\n\n'''
              s=s.replace(marker,insert+marker,1)
          old='''                        const payoutBlocks = Math.floor(vehicle.payoutDistanceMeters / 5000);\n                        const arrivalPayout = payoutBlocks * 10;\n                        vehicle.payoutDistanceMeters = vehicle.payoutDistanceMeters % 5000;\n                        total += arrivalPayout;'''
          new='''                        const payoutBlocks = Math.floor(vehicle.payoutDistanceMeters / 5000);\n                        const distancePayout = payoutBlocks * 10;\n                        vehicle.payoutDistanceMeters = vehicle.payoutDistanceMeters % 5000;\n                        const passengerCapacity = getPassengerCapacity(vehicle);\n                        const passengerCount = getRandomPassengerLoad(passengerCapacity);\n                        const passengerPayout = passengerCount * 3;\n                        const arrivalPayout = distancePayout + passengerPayout;\n                        total += arrivalPayout;'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('vehicle.stats.earned = Number(vehicle.stats.earned||0) + arrivalPayout;','vehicle.stats.earned = Number(vehicle.stats.earned||0) + arrivalPayout;\n                        vehicle.stats.passengers = Number(vehicle.stats.passengers||0) + passengerCount;\n                        vehicle.stats.passengerPayout = Number(vehicle.stats.passengerPayout||0) + passengerPayout;',1)
          old_detail='const detail=`🕐 ${t} · ТС ${vehicle.model||\'—\'} · маршрут №${a.route.number||\'—\'} · прибытие на конечную · ${arrivalPayout>0?`+${arrivalPayout} р.`:\'без выплаты\'} · пройдено ${(routeMeters/1000).toFixed(2)} км · до следующей выплаты ${((5000-vehicle.payoutDistanceMeters)%5000/1000 || 0).toFixed(2)} км`;'
          new_detail='const detail=`🕐 ${t} · ТС ${vehicle.model||\'—\'} · маршрут №${a.route.number||\'—\'} · прибытие на конечную · 👥 ${passengerCount}/${passengerCapacity||\'—\'} пассажиров · расстояние +${distancePayout} р. · пассажиры +${passengerPayout} р. · ${arrivalPayout>0?`итого +${arrivalPayout} р.`:\'без выплаты\'} · пройдено ${(routeMeters/1000).toFixed(2)} км · до следующей выплаты ${((5000-vehicle.payoutDistanceMeters)%5000/1000 || 0).toFixed(2)} км`;'
          s=s.replace(old_detail,new_detail,1)
          s=s.replace('details:[detail]});','details:[detail],passengers:passengerCount,passengerCapacity:passengerCapacity,distancePayout:distancePayout,passengerPayout:passengerPayout});',1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<option value="service">Служебный</option>\n<option value="—">—</option>','<option value="service">Служебный</option>\n<option value="museum">Музейный</option>\n<option value="—">—</option>')
          p.write_text(s,encoding='utf-8')
          p=Path('busphoto-common.js'); s=p.read_text(encoding='utf-8').replace('linear: "Линейный", service: "Служебный",','linear: "Линейный", service: "Служебный", museum: "Музейный",')
          p.write_text(s,encoding='utf-8')
          for f in ['main-sync.js','interactive-sync.js','interactive-sync.html']:
              Path(f).unlink(missing_ok=True)
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\s*<script[^>]+main-sync\.js[^>]*>\s*</script>','',s); s=re.sub(r'\s*<section id="mainSyncRoot".*?</section>','',s,flags=re.S); p.write_text(s,encoding='utf-8')
          PY
          node --check busphoto-interactive.js
          node --check busphoto-common.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Добавить выплаты за пассажиров и музейное назначение'
          git push
