name: BUSPHOTO restore stable files
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable interactive files
        run: |
          git fetch --no-tags --depth=1 origin 32bfa9aed21dbf87be0f3d0a4bbcc31336c116a0
          git restore --source=32bfa9aed21dbf87be0f3d0a4bbcc31336c116a0 -- busphoto-interactive.js creating_card.html interactive-routes.html
          rm -f .github/workflows/busphoto-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add busphoto-interactive.js creating_card.html interactive-routes.html .github/workflows/busphoto-check.yml .github/workflows/busphoto-restore-good.yml
          git rm .github/workflows/busphoto-restore-good.yml
          git diff --cached --quiet || git commit -m "Restore stable interactive files"
          git push
