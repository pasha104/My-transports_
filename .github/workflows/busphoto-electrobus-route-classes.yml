name: BUSPHOTO electrobus route classes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('busphoto-interactive.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const routeServiceType = type==='bus' ? (document.getElementById('mapBusRouteClass')?.value || 'city') : 'city';", "const routeServiceType = (type==='bus'||type==='electrobus') ? ((document.getElementById('mapBusRouteClass')?.value || 'city')==='intercity' ? 'city' : (document.getElementById('mapBusRouteClass')?.value || 'city')) : 'city';")
          s=s.replace("const service=type==='bus'?(document.getElementById('mapBusRouteClass')?.value||'city'):'city';", "const service=(type==='bus'||type==='electrobus')?((document.getElementById('mapBusRouteClass')?.value||'city')==='intercity'?'city':(document.getElementById('mapBusRouteClass')?.value||'city')):'city';")
          s=s.replace("${route.routeType==='bus'?' · '+escapeHtml(routeServiceLabel(route.routeServiceType)):''}", "${(route.routeType==='bus'||route.routeType==='electrobus')?' · '+escapeHtml(routeServiceLabel(route.routeServiceType)):''}")
          s=s.replace("${routeTypeLabel(route.routeType)}${route.routeType==='bus'?' · '+escapeHtml(routeServiceLabel(route.routeServiceType)):''}", "${routeTypeLabel(route.routeType)}${(route.routeType==='bus'||route.routeType==='electrobus')?' · '+escapeHtml(routeServiceLabel(route.routeServiceType)):''}")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add busphoto-interactive.js .github/workflows/busphoto-electrobus-route-classes.yml
          git rm .github/workflows/busphoto-electrobus-route-classes.yml
          git diff --cached --quiet || git commit -m "Enable city and suburban classes for electrobus routes"
          git push
