name: Patch search now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('busphoto-interactive.js'); s=p.read_text(encoding='utf-8')
          old="const visibleRoutes = gameState.routes.filter(route => (mapState.routeTypeFilter === 'all' || route.routeType === mapState.routeTypeFilter));"
          new="const routeQuery = (document.getElementById('routeSearchInput')?.value || '').trim().toLowerCase();\n            const visibleRoutes = gameState.routes.filter(route => (mapState.routeTypeFilter === 'all' || route.routeType === mapState.routeTypeFilter) && (!routeQuery || [route.number, route.start, route.end].some(x => String(x ?? '').toLowerCase().includes(routeQuery))));"
          if 'routeSearchInput' not in s and old in s:
              s=s.replace(old,new,1)
          if 'routeSearchInput' in s and 'routeSearchInput.addEventListener' not in s:
              needle='const list = document.getElementById(\'routesList\');'
              s=s.replace(needle, needle+"\n            const routeSearchInput = document.getElementById('routeSearchInput');\n            if (routeSearchInput && !routeSearchInput.dataset.bound) { routeSearchInput.dataset.bound='1'; routeSearchInput.addEventListener('input', renderRoutes); }",1)
          p.write_text(s,encoding='utf-8')
          p=Path('creating_card.html'); s=p.read_text(encoding='utf-8')
          if 'class="route-search"' not in s:
              s=s.replace('<label class="field">Маршрут<select class="route"></select></label>', '<label class="field">Маршрут<div style="display:flex;flex-direction:column;gap:6px"><input class="route-search" type="search" placeholder="Поиск маршрута по номеру или названию..." style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #aaa;border-radius:8px"><select class="route"></select></div></label>',1)
              s=s.replace("d.querySelector('.route').onchange=()=>{fillStops(d);recalc()};", "d.querySelector('.route').onchange=()=>{fillStops(d);recalc()};d.querySelector('.route-search').oninput=()=>fillRoutes(d);",1)
              s=s.replace("const rs=routesFor(vehicle()),s=d.querySelector('.route'),cur=selected||s.value;", "const rs=routesFor(vehicle()),s=d.querySelector('.route'),q=(d.querySelector('.route-search')?.value||'').trim().toLowerCase(),cur=selected||s.value;const filtered=rs.filter(r=>!q||[r.number,r.start,r.end].some(x=>String(x??'').toLowerCase().includes(q)));",1)
              s=s.replace('s.innerHTML=rs.length?rs.map(r=>','s.innerHTML=filtered.length?filtered.map(r=>',1)
              s=s.replace('rs.some(r=>String(r.id)===String(cur))','filtered.some(r=>String(r.id)===String(cur))',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add busphoto-interactive.js creating_card.html .github/workflows/patch-search-now.yml
          git commit -m 'Добавить поиск маршрутов' || exit 0
          git push
