name: Add museum purpose

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add museum purpose
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<option value="linear">Линейный</option><option value="service">Служебный</option><option value="—">—</option>'
          new = '<option value="linear">Линейный</option><option value="service">Служебный</option><option value="museum">Музейный</option><option value="—">—</option>'
          if old in s and 'value="museum">Музейный' not in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Добавить назначение Музейный'
          git push
