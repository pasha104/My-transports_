name: Add museum purpose

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add museum purpose to database forms
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('<option value="service">Служебный</option>\n<option value="—">—</option>', '<option value="service">Служебный</option>\n<option value="museum">Музейный</option>\n<option value="—">—</option>')
          if s2 == s:
              s2 = s.replace('<option value="service">Служебный</option><option value="—">—</option>', '<option value="service">Служебный</option><option value="museum">Музейный</option><option value="—">—</option>')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Добавить Музейный в назначение ТС'
          git push
