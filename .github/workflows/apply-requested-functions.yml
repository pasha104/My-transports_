name: Apply requested functions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch requested functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Main DB: remove sync UI/scripts and ensure Museum purpose exists.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('main-sync.js?v=20260830-main-sync','')
          s=re.sub(r'<section id="mainSyncRoot".*?</section>\s*','',s,flags=re.S)
          s=s.replace('<option value="service">Служебный</option><option value="—">—</option>','<option value="service">Служебный</option><option value="museum">Музейный</option><option value="—">—</option>')
          # Repair the add-form nesting if present from an earlier partial edit.
          s=re.sub(r'(<div class="form-group"><label>Полная модель:</label><input id="newModel"[^>]*>)(<div class="form-group"><label>Префикс модели)',r'\1</div><div class="form-group"><label>Префикс модели',s,count=1)
          p.write_text(s,encoding='utf-8')

          # Interactive route search: additive only.
          p=Path('interactive-routes.html'); s=p.read_text(encoding='utf-8')
          if 'id="gameRouteSearch"' not in s:
              s=s.replace('<div id="routesList"></div>','<input id="gameRouteSearch" type="search" placeholder="🔎 Поиск маршрута по номеру, названию или конечным..." oninput="renderRoutes()" style="width:100%;box-sizing:border-box;padding:9px 10px;margin:0 0 8px;border:1px solid var(--bp-border);border-radius:8px;background:var(--bp-input-bg);color:var(--bp-text);">\n<div id="routesList"></div>',1)
          p.write_text(s,encoding='utf-8')

          # Filter the route list by the new search field.
          p=Path('busphoto-interactive.js'); s=p.read_text(encoding='utf-8')
          old="const visibleRoutes = gameState.routes.filter(route => (mapState.routeTypeFilter === 'all' || route.routeType === mapState.routeTypeFilter));"
          new="const routeSearch = String(document.getElementById('gameRouteSearch')?.value || '').trim().toLowerCase();\n            const visibleRoutes = gameState.routes.filter(route => { const typeOk = mapState.routeTypeFilter === 'all' || route.routeType === mapState.routeTypeFilter; if (!typeOk) return false; if (!routeSearch) return true; const hay = [route.number, route.name, route.start, route.end, route.routeServiceType].filter(Boolean).join(' ').toLowerCase(); return hay.includes(routeSearch); });"
          if 'gameRouteSearch' not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Card route search: additive input + filtering, preserving the existing layout/CSS.
          p=Path('creating_card.html'); s=p.read_text(encoding='utf-8')
          if 'class="route-search"' not in s:
              s=s.replace('<label class="field">Маршрут<select class="route"></select></label>','<label class="field">Маршрут<input class="route-search" type="search" placeholder="🔎 Поиск маршрута..."><select class="route"></select></label>',1)
          oldfill="function fillRoutes(d,selected){const rs=routesFor(vehicle()),s=d.querySelector('.route'),cur=selected||s.value;s.innerHTML=rs.length?rs.map(r=>`<option value=\"${esc(r.id)}\">№${esc(r.number)} — ${esc(r.start||'—')} → ${esc(r.end||'—')}</option>`).join(''):'<option value=\"\">Нет подходящих маршрутов</option>';if(cur&&rs.some(r=>String(r.id)===String(cur)))s.value=cur}"
          if 'const q=String(d.querySelector(\'.route-search\')' not in s:
              newfill="function fillRoutes(d,selected){const rs=routesFor(vehicle()),s=d.querySelector('.route'),q=String(d.querySelector('.route-search')?.value||'').trim().toLowerCase(),cur=selected||s.value;const filtered=rs.filter(r=>!q||[r.number,r.name,r.start,r.end,r.routeServiceType].filter(Boolean).join(' ').toLowerCase().includes(q));s.innerHTML=filtered.length?filtered.map(r=>`<option value=\"${esc(r.id)}\">№${esc(r.number)} — ${esc(r.start||'—')} → ${esc(r.end||'—')}</option>`).join(''):'<option value=\"\">Нет подходящих маршрутов</option>';if(cur&&filtered.some(r=>String(r.id)===String(cur)))s.value=cur}"
              s=s.replace(oldfill,newfill,1)
          needle="d.querySelector('.route').onchange=()=>{fillStops(d);recalc()};"
          if "d.querySelector('.route-search').oninput" not in s:
              s=s.replace(needle,needle+"d.querySelector('.route-search').oninput=()=>{const cur=d.querySelector('.route').value;fillRoutes(d,cur);fillStops(d);recalc()};",1)
          p.write_text(s,encoding='utf-8')

          # Passenger system: load existing maintained file through interactive.html.
          p=Path('interactive.html'); s=p.read_text(encoding='utf-8')
          if 'passenger-system.js' not in s:
              s=s.replace('<script defer="True" src="interactive-loader.js?v=20260823-v81"></script>','<script defer="True" src="interactive-loader.js?v=20260823-v81"></script><script defer src="passenger-system.js?v=20260901-passengers4"></script>')
              s=s.replace('<script defer src="interactive-loader.js?v=20260823-v81"></script>','<script defer src="interactive-loader.js?v=20260823-v81"></script><script defer src="passenger-system.js?v=20260901-passengers4"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patches
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html interactive-routes.html busphoto-interactive.js creating_card.html interactive.html
          git commit -m 'Добавить поиск маршрутов и подключить выплаты пассажиров'
          git push
