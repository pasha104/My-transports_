<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUSPHOTO — Карточка ТС</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="cardFrame" src="creating_card.html"></iframe><script>
const f=document.getElementById('cardFrame');
function mapOpen(w,routeId,vehicleId){if(!routeId)return;window.location.href=`interactive.html?open=map&routeId=${encodeURIComponent(routeId)}${vehicleId?`&vehicleId=${encodeURIComponent(vehicleId)}`:''}`}
function enhance(){const w=f.contentWindow,d=f.contentDocument;if(!d||!w)return;const css=d.createElement('style');css.textContent='.bp-card-map-btn{margin-top:8px!important;background:#eaf5ee!important;border-color:#145a32!important;color:#145a32!important}';d.head.appendChild(css);const fix=()=>{d.querySelectorAll('.stage').forEach(stage=>{const rs=stage.querySelector('.route');if(!rs)return;const r=typeof w.routeBy==='function'?w.routeBy(rs.value):null;if(!r)return;const ts=typeof w.terminals==='function'?w.terminals(r):[];['from','to'].forEach((cl,i)=>{const sel=stage.querySelector('.'+cl),id=sel?.value;if(!sel)return;const t=ts.find(x=>String(x.id)===String(id));if(t&&t.name&&!/^Конечная(?: №\d+)?$/.test(t.name))return;const idx=ts.findIndex(x=>String(x.id)===String(id));const name=idx===0?(r.start||ts[0]?.name):idx===ts.length-1?(r.end||ts[ts.length-1]?.name):ts[idx]?.name;if(name){const opt=[...sel.options].find(o=>String(o.value)===String(id));if(opt)opt.textContent=name;}});if(!stage.querySelector('.bp-card-map-btn')){const b=d.createElement('button');b.type='button';b.className='btn bp-card-map-btn';b.textContent='🗺️ Просмотр/настройка через карту';b.onclick=()=>{const v=typeof w.vehicle==='function'?w.vehicle():null;mapOpen(w,rs.value,v?.id)};stage.appendChild(b);}});d.querySelectorAll('.saved').forEach(card=>{if(card.querySelector('.bp-card-map-btn'))return;const id=card.dataset.card;const cards=JSON.parse(w.localStorage.getItem('busphoto_service_cards_v1')||'[]');const c=cards.find(x=>String(x.id)===String(id));if(!c)return;const b=d.createElement('button');b.type='button';b.className='btn bp-card-map-btn';b.textContent='🗺️ Открыть маршрут на карте';b.onclick=()=>mapOpen(w,c.routeId,c.vehicleId);card.appendChild(b);});};fix();new MutationObserver(fix).observe(d.body,{childList:true,subtree:true});if(!d.getElementById('bpCardFixesScript')){const s=d.createElement('script');s.id='bpCardFixesScript';s.src='card-fixes.js?v=20260902-fixes1';d.head.appendChild(s);}}
f.addEventListener('load',()=>{enhance();if(new URLSearchParams(location.search).get('cards')==='1')setTimeout(()=>f.contentDocument.getElementById('cardsSection')?.scrollIntoView({behavior:'smooth',block:'start'}),350);});</script></body></html>
