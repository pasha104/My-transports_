<div class="game-section" id="game-section-routes">
<div class="route-menu-grid">
<div class="interactive-card">
<h3>🛣️ Управление маршрутами</h3>
<div class="interactive-muted" style="margin-bottom:8px;">
Маршруты и привязка ТС настраиваются только через раздел «🗺️ Карта». Здесь находится только просмотр уже созданных маршрутов.
</div>
<div class="route-map-link-hint">🗺️ Открой «Карта» → выбери маршрут → настрой его там.</div>
</div>
</div>
<div class="interactive-card" style="margin-top:12px;">
<h3>🛣️ Мои маршруты</h3>
<div class="interactive-muted" style="margin-bottom:8px;">Создание и настройка маршрутов выполняются в разделе «Карта».</div>
<div class="map-filter-row" style="margin-bottom:8px;">
<button class="map-filter-btn active" id="gameRouteFilterAll" onclick="setGameRouteTypeFilter('all')">Все</button>
<button class="map-filter-btn" id="gameRouteFilterBus" onclick="setGameRouteTypeFilter('bus')">🚌 Автобусы</button>
<button class="map-filter-btn" id="gameRouteFilterElectrobus" onclick="setGameRouteTypeFilter('electrobus')">⚡ Электробусы</button>
<button class="map-filter-btn" id="gameRouteFilterTrolleybus" onclick="setGameRouteTypeFilter('trolleybus')">🚎 Троллейбусы</button>
</div>
<div style="margin:8px 0;"><input id="routeSearchInput" type="search" placeholder="Поиск маршрута по номеру или названию..." style="width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bp-border);border-radius:8px;background:var(--bp-input-bg);color:var(--bp-text);"></div>
<input id="gameRouteSearch" type="search" placeholder="🔎 Поиск маршрута по номеру, названию или конечным..." oninput="renderRoutes()" style="width:100%;box-sizing:border-box;padding:9px 10px;margin:0 0 8px;border:1px solid var(--bp-border);border-radius:8px;background:var(--bp-input-bg);color:var(--bp-text);">
<div id="routesList"></div>
</div>
</div>
