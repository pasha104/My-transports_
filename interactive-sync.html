<div class="game-section" id="game-section-sync">
  <div class="interactive-card">
    <h3>☁️ Синхронизация</h3>
    <p id="busSyncIntro" style="color:var(--bp-text-muted);line-height:1.5;">Введи свой Gmail (или другой email) и придумай пароль. После регистрации придёт письмо — подтверди адрес. Затем используй эти же email и пароль на 2 и более устройствах.</p>
    <div id="busSyncAuth" style="display:none;">
      <div style="display:grid;gap:8px;max-width:520px;">
        <input id="busSyncEmail" type="email" placeholder="Email" autocomplete="email" style="padding:10px;background:var(--bp-input-bg);color:var(--bp-text);border:1px solid var(--bp-border);border-radius:6px;box-sizing:border-box;width:100%;">
        <input id="busSyncPassword" type="password" placeholder="Пароль" autocomplete="current-password" style="padding:10px;background:var(--bp-input-bg);color:var(--bp-text);border:1px solid var(--bp-border);border-radius:6px;box-sizing:border-box;width:100%;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-primary" type="button" id="busSyncLogin">Войти</button>
          <button class="btn-secondary" type="button" id="busSyncSignup">Создать аккаунт</button>
          <button class="btn-secondary" type="button" id="busSyncResend">📨 Отправить письмо ещё раз</button>
        </div>
      </div>
    </div>
    <div id="busSyncPanel" style="display:none;">
      <div id="busSyncUser" class="interactive-badge" style="margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button class="btn-primary" type="button" id="busSyncSave">☁️ Сохранить в облако</button>
        <button class="btn-secondary" type="button" id="busSyncLoad">⬇️ Загрузить из облака</button>
        <button class="btn-secondary" type="button" id="busSyncLogout">Выйти</button>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--bp-text);">
        <input id="busSyncAuto" type="checkbox"> Автосинхронизация после изменений
      </label>
      <div id="busSyncInfo" style="color:var(--bp-text-muted);font-size:12px;line-height:1.5;"></div>
    </div>
    <div id="busSyncStatus" class="interactive-badge" style="margin-top:10px;">Синхронизация не запущена.</div>
  </div>
</div>
