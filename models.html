<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="stylesheet" href="busphoto-common.css?v=20260820-v43">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// Удаляем старый Service Worker/кэш, который мог отдавать старую версию сайта.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(() => {});
}
if (window.caches) {
  caches.keys().then(keys => keys.forEach(key => caches.delete(key))).catch(() => {});
}
</script>
<title>BUSPHOTO — Список моделей</title>
<script src="busphoto-common.js?v=20260830-main-sync" defer></script>
<script src="main-sync.js?v=20260830-main-sync" defer></script>
</head>
