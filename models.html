<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="stylesheet" href="busphoto-common.css?v=20260820-v43">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSPHOTO — Список моделей</title>
<script src="busphoto-common.js?v=20260830-main-sync" defer></script>
</head>
<body class="light-theme">
<header><div><span class="logo-box">BUSPHOTO</span><span id="header-subtitle" style="font-size:15px;font-weight:bold;margin-left:8px;">Список моделей</span></div><div class="header-controls"><select aria-label="Язык" class="theme-toggle-btn language-select" id="headerLangSelect" onchange="changeLanguage(this.value)"><option value="ru">Русский (Русский)</option><option value="be">Беларуская (Белорусский)</option><option value="uk">Українська (Украинский)</option><option value="en">English (Английский)</option><option value="de">Deutsch (Немецкий)</option><option value="zh">中文 (Китайский)</option></select><button class="theme-toggle-btn" onclick="toggleDeviceMode()">📱/💻 <span id="deviceModeLabel">Авто</span></button><button class="theme-toggle-btn" onclick="toggleTheme()">🌓 Сменить тему</button></div></header>
<nav><a class="nav-btn" href="index.html">📋 База данных + поиск</a><a class="nav-btn active" href="models.html">🚍 Список моделей</a><a class="nav-btn" href="interactive.html">🎮 Интерактив</a><a class="nav-btn" href="sync.html">☁️ Синхронизация</a></nav>
<div class="main-wrapper"><div class="page-header">🚍 Список моделей</div><div class="filter-panel"><input id="modelSearch" type="text" placeholder="Поиск модели..." oninput="renderModels()"><button class="btn-secondary" onclick="openModelAdd()">➕ Добавить модель</button></div><div id="modelsList"></div></div>
<script src="models-import-export.js" defer></script>
<script>
function renderModels(){const q=(document.getElementById('modelSearch')?.value||'').toLowerCase();const list=(window.BUSPHOTO_MODELS||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('modelsList').innerHTML=list.map((m,i)=>`<div class="filter-panel" style="margin-bottom:8px"><b>${escapeHtml(m.name||'—')}</b><div style="font-size:12px;margin-top:4px">${escapeHtml(m.type||'')} ${m.subtype?'· '+escapeHtml(m.subtype):''}</div></div>`).join('')||'<div class="filter-panel">Модели не найдены.</div>'}
function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.addEventListener('DOMContentLoaded',()=>{if(window.BUSPHOTOInitModels)window.BUSPHOTOInitModels();renderModels()});
</script>
</body></html>
