<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="stylesheet" href="busphoto-common.css?v=20260819-fixed5">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(() => {}); }
if (window.caches) { caches.keys().then(keys => keys.forEach(key => caches.delete(key))).catch(() => {}); }
</script>
<title>BUSPHOTO — Создать карточку для интерактива</title>
<script src="busphoto-common.js?v=20260819-fixed5" defer></script>
</head>
<body class="light-theme">
<header>
<div><span class="logo-box">BUSPHOTO</span><span id="header-subtitle" style="font-size:15px; font-weight:bold; margin-left:8px;">Интерактив — транспортный бизнес</span></div>
<div class="header-controls">
<select aria-label="Язык" class="theme-toggle-btn language-select" id="headerLangSelect" onchange="changeLanguage(this.value)"><option value="ru">Русский (Русский)</option><option value="be">Беларуская (Белорусский)</option><option value="uk">Українська (Украинский)</option><option value="en">English (Английский)</option><option value="de">Deutsch (Немецкий)</option><option value="zh">中文 (Китайский)</option></select>
<button class="theme-toggle-btn" onclick="toggleDeviceMode()" title="Переключить интерфейс между режимом ПК и мобильным">📱/💻 <span id="deviceModeLabel">Авто</span></button>
<button class="theme-toggle-btn" onclick="toggleTheme()">🌓 Сменить тему</button>
<div style="font-size:11px; color:#c8e6c9;"><span id="txt-in-base">ТС в базе</span>: <b id="dbCount">0</b></div>
</div>
</header>
<nav>
<a class="nav-btn" href="index.html" style="display:block; color:#e2f0d9; padding:9px 12px; font-size:11px; font-weight:bold; border-bottom:3px solid transparent; flex-shrink:0;">📋 База данных + поиск</a>
<a class="nav-btn active" href="create-card.html" style="display:block; color:#e2f0d9; padding:9px 12px; font-size:11px; font-weight:bold; border-bottom:3px solid transparent; flex-shrink:0;">📝 Создать карточку</a>
<a class="nav-btn" href="models.html" style="display:block; color:#e2f0d9; padding:9px 12px; font-size:11px; font-weight:bold; border-bottom:3px solid transparent; flex-shrink:0;">🚍 Список моделей</a>
<a class="nav-btn" href="interactive.html" style="display:block; color:#e2f0d9; padding:9px 12px; font-size:11px; font-weight:bold; border-bottom:3px solid transparent; flex-shrink:0;">🎮 Интерактив</a>
</nav>
<div class="main-wrapper"><div class="tab-content active" id="create-card-tab">
<div class="page-header">📝 Создать карточку ТС для интерактива</div>
<div style="background:var(--bp-card-bg); border:1px solid var(--bp-border); padding:15px; max-width:900px; box-sizing:border-box;">
<div class="vehicle-subtitle" style="margin-bottom:12px;">Эта карточка добавляет ТС прямо в <b>«Мой гараж»</b> интерактива. Деньги за создание карточки не списываются.</div>
<div id="createCardSuccess" style="display:none; background:#1f6b3a; color:#fff; padding:10px; margin-bottom:12px; border-radius:3px; font-weight:bold;"></div>
<div id="createCardError" style="display:none; background:#8b1e1e; color:#fff; padding:10px; margin-bottom:12px; border-radius:3px; font-weight:bold;"></div>
<form id="addVehicleForm" onsubmit="saveInteractiveVehicle(event)" style="display:flex; flex-direction:column; gap:10px;">
<div class="form-grid">
<div class="form-group"><label>Тип ТС:</label><select id="newGameCategory" required><option value="bus">🚌 Автобус</option><option value="trolleybus">🚎 Троллейбус</option><option value="electrobus">⚡ Электробус</option></select></div>
<div class="form-group"><label>Модель:</label><input id="newGameModel" placeholder="МАЗ-203" required type="text"></div>
<div class="form-group"><label>Госномер:</label><input id="newGamePlate" placeholder="АС 6421-7" type="text"></div>
<div class="form-group"><label>Бортовой / гаражный №:</label><input id="newGameNum" placeholder="23145" type="text"></div>
<div class="form-group"><label>Стоимость ТС:</label><input id="newGamePrice" min="0" step="1" type="number" value="0"></div>
<div class="form-group"><label>Ежедневная зарплата:</label><input id="newGameSalary" min="0" step="1" type="number" value="10000"></div>
<div class="form-group"><label>Парк / депо:</label><select id="newGameDepot"><option value="ap5">Автобусный парк №5</option><option value="tp4">Транспортный парк №4</option></select></div>
</div>
<div class="form-group"><label>Примечание:</label><input id="newGameNote" placeholder="Необязательно" type="text"></div>
<button type="submit" style="background:#28a745; color:#fff; border:none; padding:11px; font-weight:bold; border-radius:3px; cursor:pointer; margin-top:5px;">💾 Создать карточку и добавить в гараж</button>
</form>
</div></div></div>
<script>
function moneyInteractive(v) { return Math.round(Number(v)||0).toLocaleString('ru-RU') + ' р.'; }
function randomInteractivePlate() {
  const letters = ['С','Е','К','Р','О','Н','Т','Х','І'];
  const letter = letters[Math.floor(Math.random()*letters.length)];
  return 'А' + letter + ' ' + String(Math.floor(Math.random()*10000)).padStart(4,'0') + '-7';
}
function showCreateMessage(id, text) {
  const el=document.getElementById(id); if(!el) return;
  el.textContent=text; el.style.display='block';
  const other=id==='createCardSuccess'?'createCardError':'createCardSuccess';
  const o=document.getElementById(other); if(o)o.style.display='none';
}
function saveInteractiveVehicle(event) {
  event.preventDefault();
  try {
    let state={balance:50000,month:1,lastPayoutDate:null,owned:[],routes:[],log:[]};
    const raw=localStorage.getItem('busphoto_interactive_game');
    if(raw) state=Object.assign(state,JSON.parse(raw));
    if(!Array.isArray(state.owned)) state.owned=[];
    if(!Array.isArray(state.routes)) state.routes=[];
    if(!Array.isArray(state.log)) state.log=[];

    const category=document.getElementById('newGameCategory').value;
    const model=document.getElementById('newGameModel').value.trim();
    const plate=document.getElementById('newGamePlate').value.trim() || randomInteractivePlate();
    const num=document.getElementById('newGameNum').value.trim();
    const price=Math.max(0,Number(document.getElementById('newGamePrice').value)||0);
    const salary=Math.max(0,Number(document.getElementById('newGameSalary').value)||0);
    const depot=document.getElementById('newGameDepot').value;
    const note=document.getElementById('newGameNote').value.trim();
    if(!model) return showCreateMessage('createCardError','Укажи модель ТС.');

    const vehicle={
      id:Date.now()+Math.random(), category, model, price,
      currentSalary:salary, lastPaidDate:null, plate, num,
      depot, note
    };
    state.owned.push(vehicle);
    state.log.unshift({date:new Date().toISOString().slice(0,10),month:state.month,total:0,details:[`Создана карточка: ${model}`]});
    state.log=state.log.slice(0,60);
    localStorage.setItem('busphoto_interactive_game',JSON.stringify(state));
    showCreateMessage('createCardSuccess',`Карточка «${model}» создана. ТС добавлено в «Мой гараж».`);
    document.getElementById('addVehicleForm').reset();
    document.getElementById('newGamePrice').value='0';
    document.getElementById('newGameSalary').value='10000';
    setTimeout(()=>location.href='interactive.html',700);
  } catch(e) {
    console.error(e);
    showCreateMessage('createCardError','Не удалось создать карточку: '+e.message);
  }
}
</script>
</body></html>
