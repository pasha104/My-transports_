<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Информация о ТС — BUSPHOTO</title>
    <style>
        :root {
            --bp-bg: #143823;
            --bp-bg-nav: #265438;
            --bp-hover: #296446;
            --bp-main-bg: #181818;
            --bp-text: #ffffff;
            --bp-border: #333333;
            --bp-table-header: #2d2d2d;
            --bp-input-bg: #222222;
            --bp-input-text: #ffffff;
        }

        body.light-theme {
            --bp-bg: #225c38;
            --bp-bg-nav: #2d7448;
            --bp-hover: #368959;
            --bp-main-bg: #f0f2f5;
            --bp-text: #24292e;
            --bp-border: #d0d7de;
            --bp-table-header: #e6ebf0;
            --bp-input-bg: #ffffff;
            --bp-input-text: #212121;
        }

        body {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bp-main-bg);
            color: var(--bp-text);
            font-size: 12px;
            transition: background-color 0.2s, color 0.2s;
        }

        header {
            background-color: var(--bp-bg-nav);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0a2114;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box span {
            background: #28a745;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            padding: 4px 10px;
            border-radius: 3px;
            letter-spacing: 3px;
            display: inline-block;
        }

        .back-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(0,0,0,0.5);
        }

        .main-wrapper {
            padding: 15px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .vehicle-header-card {
            background: var(--bp-bg-nav);
            border: 1px solid var(--bp-border);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            color: #fff;
        }

        .vehicle-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .vehicle-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .spec-card {
            background: var(--bp-table-header);
            border: 1px solid var(--bp-border);
            padding: 12px;
            border-radius: 3px;
        }

        .spec-title {
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--bp-border);
            padding-bottom: 4px;
            color: #28a745;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(128,128,128,0.3);
        }

        .spec-label {
            opacity: 0.7;
        }

        .spec-value {
            font-weight: bold;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid var(--bp-border);
            padding-bottom: 5px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .photo-card {
            background: var(--bp-table-header);
            border: 1px solid var(--bp-border);
            border-radius: 3px;
            overflow: hidden;
            text-align: center;
        }

        .photo-box {
            height: 130px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 11px;
        }

        .photo-info {
            padding: 8px;
            font-size: 10px;
            opacity: 0.8;
        }

        .error-box {
            text-align: center;
            padding: 40px;
            font-size: 14px;
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <span>BUSPHOTO</span>
            <span style="font-size:14px; font-weight:normal; margin-left:8px;">Карточка ТС</span>
        </div>
        <a href="index.html" class="back-btn">&#8592; Назад к списку</a>
    </header>

    <div class="main-wrapper" id="content-container">
    </div>

    <script>
        // Словарь для перевода системных ключей статусов и назначений в текст
        const statusMap = {
            linear: "Линейный", service: "Служебный",
            txtAct: "Эксплуатируется", txtDecomm: "Списан", txtNotOp: "Не был в эксплуатации",
            txtNotWrk: "Не эксплуатируется", txtUnk: "Судьба неизвестна", txtMod: "КВР/Модернизация",
            txtOut: "Выведен из эксплуатации", txtTransCity: "Передан в городе", txtTransOther: "Передан в другой город", txtPlateChange: "Смена госномера"
        };

        function generateVIN(model, factoryNum) {
            if (!factoryNum || factoryNum === '—' || factoryNum === '????') return '—';
            let modelNoDot = model.split(' ')[1] ? model.split(' ')[1].replace(/\./g, '') : model.replace(/\./g, '');
            modelNoDot = modelNoDot.replace(/Т/g, 'T').replace(/Э/g, 'E').replace(/С/g, 'S');
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const randomLetter = letters[Math.floor(Math.random() * letters.length)];
            const paddedFactory = String(factoryNum).padStart(5, '0');
            return "V3N" + modelNoDot + randomLetter + paddedFactory;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Восстановление темы оформления
            let savedTheme = localStorage.getItem('busphoto_theme');
            if (savedTheme === 'dark') {
                document.body.classList.remove('light-theme');
            } else {
                document.body.classList.add('light-theme');
            }

            // Читаем базу данных из localStorage
            let vehiclesDatabase = [];
            const saved = localStorage.getItem('busphoto_custom_db');
            if (saved) {
                try {
                    vehiclesDatabase = JSON.parse(saved);
                } catch (e) {
                    console.error("Ошибка чтения базы данных", e);
                }
            }

            // Получаем ID из параметров URL
            const urlParams = new URLSearchParams(window.location.search);
            const vehicleId = parseInt(urlParams.get('id'));

            const container = document.getElementById('content-container');

            if (!isNaN(vehicleId) && vehiclesDatabase[vehicleId]) {
                const v = vehiclesDatabase[vehicleId];
                
                // Обрабатываем отображение номера
                let dispGov = v.gov && v.gov !== '—' && v.gov !== '????' ? v.gov : 'Борт. ' + (v.num || '—');

                // Устанавливаем заголовок страницы
                document.getElementById('page-title').textContent = `${v.model} (${dispGov}) — BUSPHOTO`;

                // Рендерим карточку ТС
                container.innerHTML = `
                    <div class="vehicle-header-card">
                        <div class="vehicle-title" id="vehicle-header">${v.model} — ${dispGov}</div>
                        <div class="vehicle-subtitle">${v.park || 'Предприятие не указано'}</div>
                    </div>

                    <div class="specs-grid">
                        <div class="spec-card">
                            <div class="spec-title">Основные данные</div>
                            <div class="spec-row"><span class="spec-label">Гос. номер:</span><span class="spec-value">${v.gov || '—'}</span></div>
                            <div class="spec-row"><span class="spec-label">Борт. / Гар. №:</span><span class="spec-value">${v.num || '—'}</span></div>
                            <div class="spec-row"><span class="spec-label">Предприятие:</span><span class="spec-value">${v.park || '—'}</span></div>
                            <div class="spec-row"><span class="spec-label">Назначение:</span><span class="spec-value">${statusMap[v.purposeKey] || v.purposeKey || '—'}</span></div>
                            <div class="spec-row"><span class="spec-label">Статус:</span><span class="spec-value">${statusMap[v.statusKey] || v.statusKey || '—'}</span></div>
                        </div>

                        <div class="spec-card">
                            <div class="spec-title">Технические детали</div>
                            <div class="spec-row"><span class="spec-label">Заводской №:</span><span class="spec-value">${v.factory || '—'}</span></div>
                            <div class="spec-row"><span class="spec-label">VIN-код:</span><span class="spec-value">${generateVIN(v.model, v.factory)}</span></div>
                            <div class="spec-row"><span class="spec-label">Дата постройки:</span><span class="spec-value">${v.build || '—'}</span></div>
                            <div class="spec-row"><span class="spec-label">Дата поступления:</span><span class="spec-value">${v.arrive || '—'}</span></div>
                        </div>
                    </div>

                    <div class="section-title">Фотографии и ракурсы</div>
                    <div class="photos-grid" id="photo-container">
                        <div class="photo-card">
                            <div class="photo-box">Нет фото</div>
                            <div class="photo-info">Основной ракурс (Вид спереди-сбоку)</div>
                        </div>
                    </div>
                `;

                // Динамическая подстановка загруженных фотографий ТС из базы данных
                if (v.photos && v.photos.length > 0) {
                    const photoContainer = document.getElementById('photo-container');
                    photoContainer.innerHTML = '';
                    v.photos.forEach(photo => {
                        photoContainer.innerHTML += `
                            <div class="photo-card">
                                <div class="photo-box"><img src="${photo.url || ''}" alt="Фото ТС" style="width:100%; height:130px; object-fit:cover;"></div>
                                <div class="photo-info">${photo.location || 'Ракурс'} (${photo.date || ''})</div>
                            </div>
                        `;
                    });
                }

            } else {
                container.innerHTML = `
                    <div class="error-box">
                        <h2>Транспортное средство не найдено</h2>
                        <p>Возможно, была допущена ошибка в ссылке или данные были удалены.</p>
                        <br>
                        <a href="index.html" class="back-btn" style="display:inline-block; margin-top: 15px; color:#fff;">Вернуться к списку ТС</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
